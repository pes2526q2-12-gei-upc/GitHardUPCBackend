<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSteps - Web Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Navigation -->
        <aside class="sidebar glass-panel">
            <div class="logo-container">
                <div class="logo-icon"></div>
                <h1>SafeSteps</h1>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Usuarios
                </a>
                <!-- Future modules can be added here -->
            </nav>
            <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--glass-border);">
                <button id="logoutBtn" class="nav-item" style="width:100%; background:none; border:none; cursor:pointer; color:var(--danger); font-family:var(--font-main); font-size:0.95rem;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Cerrar Sesión
                </button>
            </div>
        </aside>


        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header glass-panel">
                <h2>Gestión de Usuarios</h2>
                <div class="header-actions">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="searchInput" placeholder="Buscar por ID, nombre o email...">
                    </div>
                </div>
            </header>

            <section class="content-area">
                <div class="table-container glass-panel">
                    <table class="data-table" aria-label="Tabla de gestión de usuarios con información de ID, nombre, email, nivel, puntos y estado">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Email</th>
                                <th>Nivel / Puntos</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <!-- Rows will be populated by JS -->
                            <tr>
                                <td colspan="6" class="loading-cell">Cargando usuarios...</td>
                            </tr>
                        </tbody>
                    </table>
                    
                    <!-- Pagination Controls -->
                    <div class="pagination" id="paginationControls">
                        <button id="btnPrev" class="btn btn-secondary" disabled>Anterior</button>
                        <span id="pageInfo" class="page-info">Página 1 de 1</span>
                        <button id="btnNext" class="btn btn-secondary" disabled>Siguiente</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- User Details Modal -->
    <div id="userModal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3>Perfil de Usuario</h3>
                <button id="closeModal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content populated by JS -->
            </div>
            
            <div id="incidentsContainer" class="incidents-container hidden">
                <h4 style="margin-bottom: 1rem; border-top: 1px solid var(--glass-border); padding-top: 1rem;">Registro de Incidencias</h4>
                <div id="incidentsList" class="incidents-list">
                    <!-- Incidents populated by JS -->
                </div>
            </div>
            <div class="modal-footer">
                <div class="status-actions">
                    <button class="btn btn-success" id="btnActive">Activar</button>
                    <button class="btn btn-warning" id="btnSuspend">Suspender</button>
                    <button class="btn btn-danger" id="btnBan">Banear</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="./js/app.js"></script>
</body>
</html>
